# Fichiers dérivés du plan : un commit qui ne touche que le plan et ceux-ci est de
# l'entretien du plan (pas de lot à citer).
plan:
  files: [frontend/public/nouveautes-data/nouveautes.json]
# Livraison par `cadence deliver` (https://github.com/Sylad/cadence).
# Cloudflare Pages (intégration Git) construit et publie lui-même à chaque push sur main :
# pas de CI GitHub, rien à lancer pour déployer. La livraison se prouve par la page
# d'accueil qui porte le sha court du commit poussé (<meta name="version">, posé au build
# depuis CF_PAGES_COMMIT_SHA — frontend/src/lib/build-version.ts).
deliver:
  ci: none
  deploy: []
  verify:
    - url: https://avatar-pandora-12q.pages.dev/
      contains: '<meta name="version" content="${SHORT}">'
  verifyTimeout: 600

# Revue UX automatique des vagues (cadence orchestrate) : le programme lance l'app depuis la racine,
# sonde l'URL puis tue le groupe. Node 22 (.nvmrc) : le Node par défaut de la machine est trop ancien pour Astro 6.
orchestrate:
  # Porte de tests (L38, 25-10) : la vague lance ces deux commandes après chaque écriture ; un rouge part en correction.
  # Vérifiées vertes sur main le 25-10 : 112/112 tests, 81 pages construites. Il n'y a rien d'autre à tester : le projet n'a
  # que la suite `node --test` des scripts (données de Nouveautés et du Plan de travail, tests navigateur sur frontend/dist).
  # Les tests navigateur lisent frontend/dist (sinon ils passent en « skip »).
  build: 'cd frontend && npm run build'
  # L39 (25-10) : cadence joue maintenant `build` AVANT `test`, ligne de base comprise (cadence L333) — le build
  # n'est plus répété ici ; les tests qui lisent frontend/dist le trouvent construit par la porte `build`.
  test: 'cd frontend && npm run test:scripts'
  # Précheck sur Sonnet (cadence L328) : tranche si le livrable d'un lot est déjà là avant de lancer le travail.
  precheck: true
  ux:
    command: 'cd frontend && npx astro dev --port 4313 --host 127.0.0.1'
    url: http://127.0.0.1:4313
    timeout: 300

# Documentation qui suit le code (cadence docs.sync, L307 de cadence, 24-10) : raf check et la revue signalent un lot dont le code laisse sa doc en retard ; docs.articles = étude de cas du projet dans claude-code-codex (le bibliothécaire propose un lot là-bas).
docs:
  sync:
    # Site Astro statique : pages, composants, layouts, lib (hors contenu du codex, hors CSS, hors tests) décrits par l'arbre du README, le CLAUDE.md et HOW-IT-WORKS ; une Nouveauté vaut pour un changement visible.
    - paths: ['frontend/src/**', 'frontend/astro.config.mjs', '!frontend/src/content/**', '!**/*.css', '!**/*.test.*', '!**/*.spec.*', '!**/__snapshots__/**']
      docs: [README.md, CLAUDE.md, HOW-IT-WORKS.md, 'docs/nouveautes/*.md']
  since: 2026-10-24
  articles:
    - repo: ../claude-code-codex
      file: frontend/src/pages/case-studies/avatar-pandora.astro
